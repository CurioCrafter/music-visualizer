<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Visualizer</title>
<link rel="icon" href="icons/icon16.png">
<link rel="stylesheet" href="glass.css">
<link rel="stylesheet" href="viz.css">
</head>
<body>
  <canvas id="c"></canvas>

  <div id="pill" class="glass"></div>
  <div id="msg" class="glass" hidden></div>
  <button id="start" class="glass" hidden></button>
  <div id="fatal" class="glass" hidden></div>

  <div id="ui">
    <div id="settings" class="glass" hidden>
      <label>Look <select id="s-look"></select></label>
      <label class="row"><span>Auto-pick look</span><input type="checkbox" id="s-auto"></label>
      <label>Quality <select id="s-quality">
        <option value="0">Low (0.5x)</option><option value="1">Balanced (0.75x)</option><option value="2">High (1x)</option></select></label>
      <label>Sensitivity <input type="range" id="s-sens" min="0.5" max="2" step="0.05"></label>
      <label class="row"><span>Mouse control (M)</span><input type="checkbox" id="s-mouse"></label>
    </div>
    <div id="dock">
      <button class="glass btn" id="b-prev" title="Previous look (Left)"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="glass btn" id="b-next" title="Next look (Right)"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      <button class="glass btn" id="b-mouse" title="Mouse control (M)"><svg viewBox="0 0 24 24"><path d="M6 3l12 8-5.5 1.5L10 18z"/></svg></button>
      <button class="glass btn" id="b-set" title="Settings (S)"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2" fill="currentColor"/><circle cx="15" cy="12" r="2" fill="currentColor"/><circle cx="8" cy="17" r="2" fill="currentColor"/></svg></button>
      <button class="glass btn" id="b-full" title="Fullscreen (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </div>
  <script type="module" src="viz.js"></script>
</body>
</html>
